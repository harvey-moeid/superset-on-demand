services:
  superset:
    image: apache/superset:6.0.0
    container_name: superset
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
    volumes:
      - ./state:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@localhost --password "$$SUPERSET_ADMIN_PASSWORD" || true) &&
        superset init &&
        gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:8088 "superset.app:create_app()"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
