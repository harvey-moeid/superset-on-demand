name: Superset On-Demand

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long should Superset stay online?"
        required: true
        type: choice
        options: ["30", "60", "120", "180"]
        default: "60"

permissions:
  contents: read
  actions: read

concurrency:
  group: superset-on-demand
  cancel-in-progress: false

jobs:
  superset:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore previous state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          mapfile -t PREVIOUS_RUNS < <(
            gh run list --workflow superset-on-demand.yml --status completed --limit 20 \
              --json databaseId --jq '.[].databaseId'
          )
          RESTORED=false
          for PREVIOUS_RUN in "${PREVIOUS_RUNS[@]}"; do
            [ -n "$PREVIOUS_RUN" ] || continue
            TEMP_STATE="$(mktemp -d)"
            if gh run download "$PREVIOUS_RUN" --name superset-state --dir "$TEMP_STATE" >/dev/null 2>&1 \
              && find "$TEMP_STATE" -type f -print -quit | grep -q .; then
              cp -a "$TEMP_STATE"/. state/
              echo "Restored state from completed run $PREVIOUS_RUN."
              RESTORED=true
              rm -rf "$TEMP_STATE"
              break
            fi
            rm -rf "$TEMP_STATE"
          done
          if [ "$RESTORED" != true ]; then
            echo "No previous state artifact found in the 20 most recent completed runs."
          fi

      - name: Validate session duration
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SESSION_MINUTES" in
            30|60|120|180) ;;
            *) echo "Invalid session duration."; exit 1 ;;
          esac

      - name: Create persistent local secrets if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          if [ ! -s state/secret_key ]; then openssl rand -hex 48 > state/secret_key; fi
          if [ ! -s state/admin_password ]; then openssl rand -hex 24 > state/admin_password; fi
          chmod 600 state/secret_key state/admin_password
          {
            echo "SUPERSET_SECRET_KEY=$(cat state/secret_key)"
            echo "SUPERSET_ADMIN_PASSWORD=$(cat state/admin_password)"
          } >> "$GITHUB_ENV"

      - name: Prepare writable Superset metadata directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/superset_home
          # Migrate legacy SQLite files while preserving WAL/SHM sidecars.
          for suffix in "" "-wal" "-shm"; do
            if [ -f "state/superset.db$suffix" ] && [ ! -e "state/superset_home/superset.db$suffix" ]; then
              mv "state/superset.db$suffix" "state/superset_home/superset.db$suffix"
            fi
          done
          # Superset image uses UID 1000; its mounted metadata directory must be writable.
          sudo chown -R 1000:1000 state/superset_home
          sudo chmod 700 state/superset_home
          stat -c 'Superset metadata directory: %U:%G mode=%a path=%n' state/superset_home

      - name: Start Superset
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/health >/dev/null; then
              echo "Superset is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Superset failed to become healthy. Recent container logs:"
          docker compose logs --no-color --tail=200
          exit 1

      - name: Start temporary HTTPS tunnel and publish access details
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 --output cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:8088 --no-autoupdate > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          URL=""
          for attempt in $(seq 1 60); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 5
          done
          if [ -z "$URL" ]; then cat cloudflared.log; exit 1; fi

          {
            echo "## Superset is ready"
            echo
            echo "- URL: $URL"
            echo "- Username: `admin`"
            echo "- Password: `$(cat state/admin_password)`"
            echo "- Session duration: $SESSION_MINUTES minutes"
            echo
            echo "**Security:** the temporary URL is publicly reachable. Access is protected by the Superset admin login only. Keep the URL and password private."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Superset URL: $URL"

      - name: Keep session online
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        shell: bash
        run: sleep "$((SESSION_MINUTES * 60))"

      - name: Stop tunnel and Superset
        if: always()
        shell: bash
        run: |
          if [ -f cloudflared.pid ]; then kill "$(cat cloudflared.pid)" 2>/dev/null || true; fi
          docker compose down --remove-orphans || true
          if [ -d state/superset_home ]; then
            sudo chown -R "$(id -u):$(id -g)" state/superset_home || true
          fi

      - name: Save private state for the next session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superset-state
          path: state/
          if-no-files-found: warn
          retention-days: 90
