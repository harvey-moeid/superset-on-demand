name: Validate Cloudflare Control Plane
on:
  pull_request:
    paths:
      - "control/**"
      - ".github/workflows/deploy-*.yml"
      - ".github/workflows/validate-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "control/**"
      - ".github/workflows/deploy-*.yml"
      - ".github/workflows/validate-control-plane.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check control/worker/src/index.js
          node --check control/pages/app.js
          node --check control/pages/config.js
      - name: Validate Wrangler Worker configuration
        working-directory: control/worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/superset-worker-dry-run
      - name: Check Pages assets
        run: |
          test -s control/pages/index.html
          test -s control/pages/style.css
          grep -q "superset-control.harveymoeid.workers.dev" control/pages/config.js