name: Stop Superset

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel active Superset session
        env:
          GH_TOKEN: ${{ github.token }}
          # Job ini tidak melakukan checkout, jadi gh tidak punya konteks git.
          # GH_REPO memberi tahu gh repo mana yang dipakai.
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS=""
          for STATUS in in_progress queued; do
            FOUND="$(gh run list --workflow superset-on-demand.yml --status "$STATUS" --json databaseId --jq '.[].databaseId')"
            if [ -n "$FOUND" ]; then RUNS="$RUNS$FOUND"$'\n'; fi
          done
          if [ -z "${RUNS//[$'\n ']/}" ]; then
            echo "No active Superset session found."
            exit 0
          fi
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            echo "Cancelling Superset run $RUN_ID"
            gh run cancel "$RUN_ID" || true
          done <<< "$RUNS"
          echo "Stop request sent. GitHub Actions will run cleanup steps."
