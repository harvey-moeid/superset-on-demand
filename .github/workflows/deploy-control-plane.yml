name: Deploy Superset Control Plane
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["control/worker/**",".github/workflows/deploy-control-plane.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: control/worker
          command: deploy
        env:
          DASHBOARD_TOKEN: ${{ secrets.SUPERSET_DASHBOARD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SUPERSET_GITHUB_TOKEN }}