name: Deploy Superset Control Plane
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["control/worker/**",".github/workflows/deploy-control-plane.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: control/worker
          command: deploy
      - name: Set Worker secrets
        working-directory: control/worker
        shell: bash
        env:
          DASHBOARD_TOKEN: ${{ secrets.SUPERSET_DASHBOARD_TOKEN }}
          SUPERSET_GITHUB_TOKEN: ${{ secrets.SUPERSET_GITHUB_TOKEN }}
        run: |
          printf '%s' "$DASHBOARD_TOKEN" | npx --yes wrangler@4 secret put DASHBOARD_TOKEN
          printf '%s' "$SUPERSET_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN