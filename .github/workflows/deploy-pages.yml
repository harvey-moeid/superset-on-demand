name: Deploy Superset Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["control/pages/**",".github/workflows/deploy-pages.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy control/pages --project-name=superset-on-demand