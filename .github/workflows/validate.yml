name: Validate Superset On-Demand

on:
  push:
    paths:
      - "docker-compose.yml"
      - "superset_config.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "superset_config.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          SUPERSET_SECRET_KEY: validation-only-not-a-real-secret
          SUPERSET_ADMIN_PASSWORD: validation-only-not-a-password
        run: docker compose config --quiet
      - name: Pull pinned official Superset image
        run: docker pull apache/superset:6.1.0
      - name: Validate Python config syntax
        run: python3 -m py_compile superset_config.py
